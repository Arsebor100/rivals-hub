<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<!--
==============================================================
  RIVALS HUB — ІНСТРУКЦІЯ ДЛЯ ІІ-РЕДАКТОРІВ (НЕ ВИДАЛЯТИ)
==============================================================
  Файл єдиний: index.html. Стилі та скрипт всередині.
  Зовнішніх залежностей немає (тільки Google Fonts Inter).
  styles.css, script.js, README.md — бути НЕ ПОВИННО.

  ЖОРСТКІ ПРАВИЛА:
  1. НЕ переробляй дизайн під себе. Зберігай кольори, шрифти,
     відступи, скруглення, поточний темний стиль.
  2. НЕ додавай нові секції, кнопки, форми, фреймворки,
     залежності, аналітику, cookie-банери — якщо користувач
     ЯВНО не попросив.
  3. НЕ винось стилі/скрипт в окремі файли.
  4. НЕ видаляй мультиязычність (uk/ru/en), кнопки UA/RU/EN,
     фільтр статусів, кнопку "Запропонувати", тег, логотип гри,
     аватар автора.
  5. НЕ видаляй збереження мови в localStorage (ключ
     "rivalsHubLang"). Обрана мова має зберігатися між
     відвідуваннями.
  6. НЕ додавай поле "опис" назад у картку — воно навмисно
     видалено.
  7. Блок "Плюси" ховається автоматично, якщо масив pros
     порожній для поточної мови. "Мінуси" тоді на всю ширину.
     Це зроблено навмисно — не "виправляти".
  8. НЕ роби "я так бачу красивіше". Роби лише те, що
     просять. Незрозуміло — спитай, не додумуй.

  СТАТУСИ (тільки ці три):
    "works"    — Работает / Працює / Works
    "broken"   — Не работает / Не працює / Broken
    "deleted"  — Удалён / Видалений / Deleted

  ФОРМАТ ДАТИ: ДД.ММ.РРРР (наприклад, 24.10.2026)

  ЯК ДОДАТИ НОВИЙ МОД:
    Скопіюй об'єкт у масиві `const mods = [...]` і заміни:
      id, title, status, placeUrl, creator, creatorUrl,
      checked ("ДД.ММ.РРРР"), tag (рядок, напр. "modded shop"),
      image          — посилання на логотип гри (rbxcdn)
      creatorAvatar  — посилання на аватар автора (rbxcdn headshot)
      pros {uk,ru,en}, cons {uk,ru,en}
    pros може бути порожнім масивом [] — тоді блок не показується.
    cons обов'язково має бути непорожнім.

  ЯК ДОДАТИ МОВУ (наприклад, PL):
    У translations додай `pl: { ... }` з усіма полями,
    у .lang-switcher додай кнопку data-lang="pl",
    у кожен mod додай `pl` у pros/cons.

  КОНТАКТ / ПРИЙОМ ЗАЯВОК:
    Кнопка #suggestBtn — <a href="mailto:arsebor100@gmail.com?...">.
    Змінити канал = змінити ТІЛЬКИ href у #suggestBtn і текст
    translations.suggest.

  У МАЙБУТНЬОМУ (не зараз, не роби без прохання):
    - шрифт у стилі Rivals (заміна font-family у :root/body)
    - звуки Rivals (Audio API, клік по кнопках/картках)
==============================================================
-->
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rivals Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{--bg:#070b14;--panel:rgba(15,23,42,.8);--line:rgba(148,163,184,.18);--text:#e2e8f0;--soft:#a5b4cf;--violet:#7c3aed;--violet-2:#c084fc;--shadow:0 20px 45px rgba(15,23,42,.42)}
*{box-sizing:border-box}
body{margin:0;font-family:"Inter",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;position:relative;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,select{font:inherit}
.glow{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.25;pointer-events:none;z-index:0}
.glow-a{background:rgba(124,58,237,.55);top:80px;left:-120px}
.glow-b{background:rgba(34,197,94,.28);right:-60px;bottom:80px}
.container{width:min(1100px,calc(100% - 32px));margin:0 auto;position:relative;z-index:1}
.topbar{position:sticky;top:0;z-index:10;backdrop-filter:blur(18px);background:rgba(7,11,20,.7);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;font-weight:800;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--violet-2));box-shadow:var(--shadow)}
.brand-title{font-weight:800;letter-spacing:-.03em}
.brand-subtitle{color:var(--soft);font-size:.78rem}
.lang-switcher{display:flex;align-items:center;gap:6px;margin-left:auto}
.lang-btn{border:1px solid rgba(148,163,184,.2);background:rgba(15,23,42,.7);color:var(--soft);border-radius:8px;padding:6px 10px;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .15s ease}
.lang-btn:hover{color:var(--text);border-color:rgba(196,181,253,.35)}
.lang-btn.active{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border-color:transparent}
.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 14px}
.filter{display:grid;gap:8px;width:min(320px,100%);color:var(--soft);font-size:.82rem}
.filter select{width:100%;background:rgba(15,23,42,.8);border:1px solid rgba(148,163,184,.16);border-radius:12px;padding:12px 14px;color:var(--text);outline:none}
.suggest-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(196,181,253,.35);background:rgba(124,58,237,.1);color:#d8b4fe;border-radius:12px;padding:11px 16px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s ease}
.suggest-btn:hover{background:rgba(124,58,237,.18);border-color:rgba(196,181,253,.55);color:#f3e8ff}
.mod-list{display:grid;gap:22px;padding-bottom:40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.card-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.thumb{width:88px;height:88px;border-radius:16px;object-fit:cover;flex-shrink:0;background:rgba(148,163,184,.08);border:1px solid var(--line)}
.head-body{flex:1;min-width:0}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.card-title{margin:0;font-size:clamp(1.2rem,2vw,1.6rem)}
.card-title a:hover{color:#c4b5fd}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--soft);font-size:.82rem;margin-bottom:10px}
.avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;background:rgba(148,163,184,.1);border:1px solid var(--line)}
.creator{color:#d8b4fe}
.creator:hover{text-decoration:underline}
.dot{color:var(--soft);opacity:.6}
.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(148,163,184,.08);border:1px solid rgba(148,163,184,.14);color:var(--soft);font-size:.72rem}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:7px 10px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge-works{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.badge-broken{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.badge-deleted{background:rgba(100,116,139,.12);color:#cbd5e1;border:1px solid rgba(100,116,139,.3)}
.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.lists.single{grid-template-columns:1fr}
.list-box{padding:16px;border-radius:16px;border:1px solid rgba(148,163,184,.12);background:rgba(148,163,184,.03)}
.list-box h4{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.list-box ul{margin:0;padding-left:18px;color:var(--soft)}
.empty{padding:26px;border-radius:18px;text-align:center;color:var(--soft);background:rgba(148,163,184,.03);border:1px dashed rgba(148,163,184,.2)}
@media (max-width:720px){.nav{flex-wrap:wrap}.lists{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.suggest-btn{justify-content:center}.card-head{gap:12px}.thumb{width:64px;height:64px;border-radius:12px}.title-row{flex-direction:column;align-items:flex-start;gap:8px}}
</style>
</head>
<body>
<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<header class="topbar">
  <div class="container nav">
    <div class="brand">
      <div class="brand-mark">R</div>
      <div>
        <div class="brand-title">Rivals Hub</div>
        <div class="brand-subtitle" id="brandSubtitle">Каталог і статус проєктів</div>
      </div>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="uk" type="button">UA</button>
      <button class="lang-btn" data-lang="ru" type="button">RU</button>
      <button class="lang-btn" data-lang="en" type="button">EN</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="toolbar">
    <label class="filter">
      <span id="statusLabel">Статус</span>
      <select id="statusFilter"></select>
    </label>
    <a class="suggest-btn" id="suggestBtn"
       href="mailto:arsebor100@gmail.com?subject=Rivals%20Hub%20suggestion&body=Roblox%20link%3A%0Ahttps%3A%2F%2Fwww.roblox.com%2Fgames%2F17625359962%2FRIVALS%20(example)"
       target="_blank" rel="noopener noreferrer">
      <span id="suggestLabel">Запропонувати мод / доповнення</span>
    </a>
  </section>
  <section id="modList" class="mod-list"></section>
</main>

<script>
const translations = {
  uk: { subtitle:"Каталог і статус проєктів", status:"Статус", all:"Усі", works:"Працює", broken:"Не працює", deleted:"Видалений", checked:"Перевірено", pros:"Плюси", cons:"Мінуси", empty:"Нічого не знайдено", emptyHint:"Спробуй інший статус.", suggest:"Запропонувати мод / доповнення" },
  ru: { subtitle:"Каталог и статус проектов", status:"Статус", all:"Все", works:"Работает", broken:"Не работает", deleted:"Удалён", checked:"Проверено", pros:"Плюсы", cons:"Минусы", empty:"Ничего не найдено", emptyHint:"Попробуй другой статус.", suggest:"Предложить мод / дополнение" },
  en: { subtitle:"Catalog & status tracker", status:"Status", all:"All", works:"Works", broken:"Broken", deleted:"Deleted", checked:"Checked", pros:"Pros", cons:"Cons", empty:"No entries found", emptyHint:"Try another status.", suggest:"Suggest a mod / addition" }
};

const statusOrder = ["all","works","broken","deleted"];

// ── СПИСОК МОДІВ ─────────────────────────────────────────────
// status: "works" | "broken" | "deleted"
// checked: формат ДД.ММ.РРРР (наприклад, 24.10.2026)
// pros може бути порожнім [] — тоді блок не показується
const mods = [
  {
    id: "josh-rivals-modded",
    title: "Josh's RIVALS MODDED",
    status: "works",
    placeUrl: "https://www.roblox.com/games/94069113295113/Joshs-RIVALS-MODDED",
    creator: "Ixspan7039",
    creatorUrl: "https://www.roblox.com/users/10797552845/profile",
    checked: "24.10.2026",
    tag: "modded shop",
    image: "https://tr.rbxcdn.com/180DAY-26de3a6f3be928df6691f27dc32575c9/256/256/GameIcon4/Webp/noFilter",
    creatorAvatar: "https://tr.rbxcdn.com/30DAY-AvatarHeadshot-A634EA479C0501425C858A8C082E9D09-Png/150/150/AvatarHeadshot/Webp/noFilter",
    pros: {
      uk: [],
      ru: [],
      en: []
    },
    cons: {
      uk: ["Платна адмін-панель","Сміттєві адмін-гармати та скіни за робукси","Немає ранкед-шопу та інспектів","Закрито багато контенту: скіни ранкед-шопу, кей-скіни (окрім тих, що є в шопі), арч-скіни, кристал-скіни, секретні предмети, інше"],
      ru: ["Платная админ-панель","Мусорные админ-пушки и скины за робуксы","Нет ранкед-шопа и инспектов","Закрыто много контента: скины ранкед-шопа, кей-скины (кроме тех, что есть в шопе), арч-скины, кристалл-скины, секретные предметы, прочее"],
      en: ["Paid admin panel","Junk admin guns and skins for Robux","No ranked shop or inspects","Lots of content locked: ranked shop skins, key skins (except those available in the shop), arch skins, crystal skins, secret items, and more"]
    }
  }
];
// ─────────────────────────────────────────────────────────────

const LANG_KEY = "rivalsHubLang";

function loadSavedLang(){
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && translations[saved]) return saved;
  } catch(e) {}
  return "uk";
}

let currentLang = loadSavedLang();

const brandSubtitle = document.getElementById("brandSubtitle");
const statusLabel = document.getElementById("statusLabel");
const statusFilter = document.getElementById("statusFilter");
const modList = document.getElementById("modList");
const suggestLabel = document.getElementById("suggestLabel");
const langButtons = document.querySelectorAll(".lang-btn");

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function t(k){return (translations[currentLang] && translations[currentLang][k]) || k}
function pick(obj){ if(!obj) return []; return obj[currentLang] || obj.uk || []; }

function saveLang(lang){
  try { localStorage.setItem(LANG_KEY, lang); } catch(e) {}
}

function rebuildStatusFilter(){
  const prev = statusFilter.value || "all";
  statusFilter.innerHTML = statusOrder.map(v => '<option value="'+v+'">'+esc(t(v))+'</option>').join("");
  statusFilter.value = prev;
}

function renderMods(){
  const selected = statusFilter.value || "all";
  const visible = mods.filter(m => selected === "all" || m.status === selected);
  if(visible.length === 0){
    modList.innerHTML = '<div class="empty"><h3>'+esc(t("empty"))+'</h3><p>'+esc(t("emptyHint"))+'</p></div>';
    return;
  }
  modList.innerHTML = visible.map(m => {
    const prosArr = Array.isArray(pick(m.pros)) ? pick(m.pros) : [];
    const consArr = Array.isArray(pick(m.cons)) ? pick(m.cons) : [];
    const pros = prosArr.map(p => '<li>'+esc(p)+'</li>').join("");
    const cons = consArr.map(c => '<li>'+esc(c)+'</li>').join("");
    const tagHtml = m.tag ? '<span class="tag">'+esc(m.tag)+'</span>' : "";
    const thumbHtml = m.image ? '<img class="thumb" src="'+esc(m.image)+'" alt="'+esc(m.title)+'" loading="lazy" />' : '';
    const avatarHtml = m.creatorAvatar ? '<img class="avatar" src="'+esc(m.creatorAvatar)+'" alt="" loading="lazy" />' : '';

    const prosBox = prosArr.length
      ? '<div class="list-box"><h4>'+esc(t("pros"))+'</h4><ul>'+pros+'</ul></div>'
      : '';
    const consBox = consArr.length
      ? '<div class="list-box"><h4>'+esc(t("cons"))+'</h4><ul>'+cons+'</ul></div>'
      : '';
    const listsClass = (prosArr.length && consArr.length) ? 'lists' : 'lists single';

    return '<article class="card">'
      + '<div class="card-head">'
      +   thumbHtml
      +   '<div class="head-body">'
      +     '<div class="title-row">'
      +       '<h3 class="card-title"><a href="'+esc(m.placeUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(m.title)+'</a></h3>'
      +       '<span class="badge badge-'+esc(m.status)+'">'+esc(t(m.status))+'</span>'
      +     '</div>'
      +     '<div class="card-meta">'
      +       avatarHtml
      +       '<a class="creator" href="'+esc(m.creatorUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(m.creator)+'</a>'
      +       '<span class="dot">•</span>'
      +       '<span>'+esc(t("checked"))+': '+esc(m.checked)+'</span>'
      +     '</div>'
      +     tagHtml
      +   '</div>'
      + '</div>'
      + '<div class="'+listsClass+'">'
      +   prosBox
      +   consBox
      + '</div>'
      + '</article>';
  }).join("");
}

function applyLang(){
  brandSubtitle.textContent = t("subtitle");
  statusLabel.textContent = t("status");
  suggestLabel.textContent = t("suggest");
  document.documentElement.lang = currentLang;
  rebuildStatusFilter();
  langButtons.forEach(b => b.classList.toggle("active", b.dataset.lang === currentLang));
  renderMods();
}

langButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.dataset.lang;
    saveLang(currentLang);
    applyLang();
  });
});

statusFilter.addEventListener("change", renderMods);
applyLang();
</script>
</body>
</html>
