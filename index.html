    document.removeEventListener("click", retry);
    document.removeEventListener("touchstart", retry);
    document.removeEventListener("keydown", retry);
  };
  document.addEventListener("click", retry);
  document.addEventListener("touchstart", retry);
  document.addEventListener("keydown", retry);
}
armIntroFallback();

let clickAudioReady = false;
function playClick() {
  try {
    const a = new Audio(SOUND_CLICK_URL);
    a.volume = 0.25;
    const p = a.play();
    if (p && p.catch) p.catch(() => {});
  } catch(e) {}
}

// ── УТИЛІТИ ──────────────────────────────────────────────────
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function t(k){return (translations[currentLang] && translations[currentLang][k]) || k}
function pick(obj){ if(!obj) return []; return obj[currentLang] || obj.uk || []; }
function pickStr(obj){ if(!obj) return ""; return obj[currentLang] || obj.uk || ""; }
function saveLang(lang){ try { localStorage.setItem(LANG_KEY, lang); } catch(e) {} }

function loadSavedLang(){
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && translations[saved]) return saved;
  } catch(e) {}
  return "uk";
}
let currentLang = loadSavedLang();

const brandSubtitle = document.getElementById("brandSubtitle");
const statusLabel = document.getElementById("statusLabel");
const statusFilter = document.getElementById("statusFilter");
const modList = document.getElementById("modList");
const suggestLabel = document.getElementById("suggestLabel");
const loaderText = document.getElementById("loaderText");
const langButtons = document.querySelectorAll(".lang-btn");

function rebuildStatusFilter(){
  const prev = statusFilter.value || "all";
  statusFilter.innerHTML = statusOrder
    .map(v => '<option value="'+v+'">'+esc(t(v))+'</option>')
    .join("");
  statusFilter.value = prev;
}

function extractCode(str){
  if (!str) return "";
  const parts = String(str).split(/\s+[—–]\s+|\s+-\s+/);
  return (parts[0] || "").trim();
}

function renderMods(){
  const selected = statusFilter.value || "all";
  const visible = mods.filter(m => selected === "all" || m.status === selected);

  if (visible.length === 0) {
    modList.innerHTML = '<div class="empty"><h3>'+esc(t("empty"))+'</h3><p>'+esc(t("emptyHint"))+'</p></div>';
    return;
  }

  modList.innerHTML = visible.map(m => {
    const prosArr = Array.isArray(pick(m.pros)) ? pick(m.pros) : [];
    const consArr = Array.isArray(pick(m.cons)) ? pick(m.cons) : [];
    const codesVal = pickStr(m.codes);
    const codeCopy = extractCode(codesVal);
    const tagsArr = Array.isArray(m.tags) ? m.tags : [];

    const pros = prosArr.map(p => '<li>'+esc(p)+'</li>').join("");
    const cons = consArr.map(c => '<li>'+esc(c)+'</li>').join("");

    const tagsHtml = tagsArr.length
      ? '<div class="tags-row">'+tagsArr.map(tg => '<span class="tag">'+esc(tg)+'</span>').join("")+'</div>'
      : '';

    const codesHtml = codesVal
      ? '<div class="codes-row" role="button" tabindex="0" data-copy="'+esc(codeCopy)+'">'
        + '<span class="codes-label">'+esc(t("codes"))+':</span>'
        + '<span class="codes-value">'+esc(codesVal)+'</span>'
        + '<span class="codes-hint">'+esc(t("clickToCopy"))+'</span>'
        + '</div>'
      : '';

    const thumbHtml = m.image ? '<img class="thumb" src="'+esc(m.image)+'" alt="'+esc(m.title)+'" loading="lazy" />' : '';
    const avatarHtml = m.creatorAvatar ? '<img class="avatar" src="'+esc(m.creatorAvatar)+'" alt="" loading="lazy" />' : '';
    const groupHtml = (m.group && m.groupUrl)
      ? '<span class="dot">•</span><a class="group" href="'+esc(m.groupUrl)+'" target="_blank" rel="noopener noreferrer">'
        + (m.groupAvatar ? '<img class="avatar group" src="'+esc(m.groupAvatar)+'" alt="" loading="lazy" />' : '')
        + esc(m.group)+'</a>'
      : '';
    const discordHtml = m.discordUrl
      ? '<a class="discord-link" href="'+esc(m.discordUrl)+'" target="_blank" rel="noopener noreferrer" title="Discord">'
        + (m.discordIcon ? '<img class="discord-icon" src="'+esc(m.discordIcon)+'" alt="Discord" loading="lazy" />' : 'Discord')
        + '</a>'
      : '';

    const prosBox = prosArr.length ? '<div class="list-box"><h4>'+esc(t("pros"))+'</h4><ul>'+pros+'</ul></div>' : '';
    const consBox = consArr.length ? '<div class="list-box"><h4>'+esc(t("cons"))+'</h4><ul>'+cons+'</ul></div>' : '';
    const listsHtml = (prosArr.length || consArr.length)
      ? '<div class="' + ((prosArr.length && consArr.length) ? 'lists' : 'lists single') + '">'
        + prosBox + consBox + '</div>'
      : '';

    return '<article class="card">'
      + '<div class="card-head">'
      +   thumbHtml
      +   '<div class="head-body">'
      +     '<div class="title-row">'
      +       '<h3 class="card-title"><a href="'+esc(m.placeUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(m.title)+'</a></h3>'
      +       '<span class="badge badge-'+esc(m.status)+'">'+esc(t(m.status))+'</span>'
      +     '</div>'
      +     '<div class="card-meta">'
      +       avatarHtml
      +       '<a class="creator" href="'+esc(m.creatorUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(m.creator)+'</a>'
      +       groupHtml
      +       '<span class="dot">•</span>'
      +       '<span>'+esc(t("checked"))+': '+esc(m.checked)+'</span>'
      +       (discordHtml ? '<span class="dot">•</span>'+discordHtml : '')
      +     '</div>'
      +     tagsHtml
      +   '</div>'
      + '</div>'
      + codesHtml
      + listsHtml
      + '</article>';
  }).join("");
}

function applyLang(){
  brandSubtitle.textContent = t("subtitle");
  statusLabel.textContent = t("status");
  suggestLabel.textContent = t("suggest");
  if (loaderText) loaderText.textContent = t("loading");
  document.documentElement.lang = currentLang;
  rebuildStatusFilter();
  langButtons.forEach(b => b.classList.toggle("active", b.dataset.lang === currentLang));
  renderMods();
}

langButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    currentLang = btn.dataset.lang;
    saveLang(currentLang);
    applyLang();
  });
});
statusFilter.addEventListener("change", renderMods);

// ── КОПІЮВАННЯ КОДУ ──────────────────────────────────────────
async function copyText(text){
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e){}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e){ return false; }
}

function showCopied(row){
  row.classList.add("copied");
  const val = row.querySelector(".codes-value");
  const original = val.textContent;
  val.textContent = t("copied");
  setTimeout(() => {
    row.classList.remove("copied");
    val.textContent = original;
  }, 1200);
}

document.addEventListener("click", async (e) => {
  const row = e.target.closest(".codes-row");
  if (row) {
    e.preventDefault();
    const text = row.dataset.copy;
    if (text) {
      const ok = await copyText(text);
      if (ok) showCopied(row);
    }
    playClick();
    return;
  }
  if (e.target.closest("a, button")) playClick();
});

document.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const row = e.target.closest(".codes-row");
  if (row) {
    e.preventDefault();
    const text = row.dataset.copy;
    if (text) {
      const ok = await copyText(text);
      if (ok) showCopied(row);
    }
    playClick();
  }
});

// ── LOADER з N/G АНІМАЦІЄЮ ──────────────────────────────────
(function runLoader(){
  const loader = document.getElementById("loader");
  if (!loader) return;

  let shown = false;
  try { shown = sessionStorage.getItem(LOADER_KEY) === "1"; } catch(e){}
  if (shown) { loader.remove(); return; }

  const N = loader.querySelector(".logo-N");
  const G = loader.querySelector(".logo-G");
  const nFill = N.querySelector(".logo-fill");
  const gFill = G.querySelector(".logo-fill");
  const barFill = document.getElementById("loaderFill");

  const SPIRAL_START = 200;
  const SPIRAL_DUR   = 1500;
  const FILL_DUR     = 800;
  const FADE_START   = SPIRAL_START + SPIRAL_DUR + FILL_DUR;

  const start = performance.now();
  let done = false;

  function frame(now){
    if (done) return;
    const elapsed = now - start;

    // ── Фаза спіралі ──
    if (elapsed < SPIRAL_START) {
      // ще нічого
    } else if (elapsed < SPIRAL_START + SPIRAL_DUR) {
      const t01 = (elapsed - SPIRAL_START) / SPIRAL_DUR;
      const ease = 1 - Math.pow(1 - t01, 5); // ~ Out Quint

      const nX = -320 * (1 - ease);
      const gX =  320 * (1 - ease);

      // Формула з оригіналу:
      // v41 = (sqrt(1 - (p/100 - 1)^2) * 540 + 180) % 360
      const p = t01 * 100;
      const rad = Math.sqrt(Math.max(0, 1 - Math.pow(p/100 - 1, 2)));
      const angle = (rad * 540 + 180) % 360;

      N.style.transform = "translateX(" + nX + "px) rotate(" + (-angle) + "deg)";
      G.style.transform = "translateX(" + gX + "px) rotate(" + (-angle) + "deg)";
      N.style.opacity = Math.min(1, t01 * 2.5);
      G.style.opacity = Math.min(1, t01 * 2.5);
    } else {
      // ── Фаза заливки ──
      N.style.transform = "translateX(0) rotate(0deg)";
      G.style.transform = "translateX(0) rotate(0deg)";
      N.style.opacity = 1;
      G.style.opacity = 1;

      const ft = Math.min(1, (elapsed - SPIRAL_START - SPIRAL_DUR) / FILL_DUR);
      // v76 = 0.738 - ft * (0.738 - 0.262) = 0.738 - ft * 0.476
      const v76 = 0.738 - ft * 0.476;
      const clipPct = v76 * 100;
      nFill.style.clipPath = "inset(" + clipPct + "% 0 0 0)";
      gFill.style.clipPath = "inset(" + clipPct + "% 0 0 0)";
      barFill.style.width = (ft * 100) + "%";
    }

    if (elapsed < FADE_START + 400) {
      requestAnimationFrame(frame);
    } else {
      done = true;
      loader.classList.add("hide");
      try { sessionStorage.setItem(LOADER_KEY, "1"); } catch(e){}
      setTimeout(() => loader.remove(), 600);
    }
  }
  requestAnimationFrame(frame);
})();

applyLang();
