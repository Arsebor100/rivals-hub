<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rivals Hub</title>
<style>
@font-face{font-family:'Rubik';src:url('./assets/Rubik-Regular_12187288714.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-Medium_12187271237.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-SemiBold_12187320363.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-Bold_12187303601.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-ExtraBold_12187262242.ttf') format('truetype');font-weight:800;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-Black_12187280273.ttf') format('truetype');font-weight:900;font-display:swap}

:root{
  --bg:#070b14;--panel:rgba(15,23,42,.8);--line:rgba(148,163,184,.18);
  --text:#e2e8f0;--soft:#a5b4cf;--violet:#7c3aed;--violet-2:#c084fc;
  --shadow:0 20px 45px rgba(15,23,42,.42);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Rubik',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;position:relative;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,select{font:inherit}
.glow{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.25;pointer-events:none;z-index:0}
.glow-a{background:rgba(124,58,237,.55);top:80px;left:-120px}
.glow-b{background:rgba(34,197,94,.28);right:-60px;bottom:80px}
.container{width:min(1100px,calc(100% - 32px));margin:0 auto;position:relative;z-index:1}
.topbar{position:sticky;top:0;z-index:10;backdrop-filter:blur(18px);background:rgba(7,11,20,.7);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--violet-2));box-shadow:var(--shadow);overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;padding:6px}
.brand-title{font-weight:800;letter-spacing:-.03em}
.brand-subtitle{color:var(--soft);font-size:.78rem}
.lang-switcher{display:flex;align-items:center;gap:6px;margin-left:auto}
.lang-btn{border:1px solid rgba(148,163,184,.2);background:rgba(15,23,42,.7);color:var(--soft);border-radius:8px;padding:6px 10px;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .15s ease}
.lang-btn:hover{color:var(--text);border-color:rgba(196,181,253,.35)}
.lang-btn.active{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border-color:transparent}
.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 14px}
.filter{display:grid;gap:8px;width:min(320px,100%);color:var(--soft);font-size:.82rem}
.filter select{width:100%;background:rgba(15,23,42,.8);border:1px solid rgba(148,163,184,.16);border-radius:12px;padding:12px 14px;color:var(--text);outline:none}
.suggest-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(196,181,253,.35);background:rgba(124,58,237,.1);color:#d8b4fe;border-radius:12px;padding:11px 16px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s ease}
.suggest-btn:hover{background:rgba(124,58,237,.18);border-color:rgba(196,181,253,.55);color:#f3e8ff}
.mod-list{display:grid;gap:22px;padding-bottom:40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.card-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.thumb{width:88px;height:88px;border-radius:16px;object-fit:cover;flex-shrink:0;background:rgba(148,163,184,.08);border:1px solid var(--line)}
.head-body{flex:1;min-width:0}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.card-title{margin:0;font-size:clamp(1.2rem,2vw,1.6rem)}
.card-title a:hover{color:#c4b5fd}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--soft);font-size:.82rem;margin-bottom:10px}
.avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;background:rgba(148,163,184,.1);border:1px solid var(--line)}
.avatar.group{width:18px;height:18px;border-radius:6px}
.creator,.group{color:#d8b4fe;display:inline-flex;align-items:center;gap:6px}
.creator:hover,.group:hover{text-decoration:underline}
.discord-link{display:inline-flex;align-items:center;justify-content:center;color:#d8b4fe;transition:transform .12s ease}
.discord-link:hover{transform:scale(1.1)}
.discord-icon{width:20px;height:20px;object-fit:contain;border-radius:6px}
.dot{color:var(--soft);opacity:.6}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(148,163,184,.08);border:1px solid rgba(148,163,184,.14);color:var(--soft);font-size:.72rem}

.codes-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:10px 14px;border-radius:12px;
  background:rgba(250,204,21,.06);
  border:1px solid rgba(250,204,21,.22);
  margin-bottom:16px;font-size:.82rem;color:#fde68a;
  cursor:pointer;user-select:none;
  transition:background .15s ease, border-color .15s ease, transform .08s ease;
}
.codes-row:hover{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.4)}
.codes-row:active{transform:scale(.99)}
.codes-row.copied{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.4)}
.codes-row .codes-label{color:#facc15;font-weight:600}
.codes-row .codes-value{color:#fef3c7;font-family:'Rubik',monospace;letter-spacing:.02em;transition:color .15s ease}
.codes-row.copied .codes-value{color:#86efac}
.codes-hint{color:rgba(250,204,21,.5);font-size:.7rem;margin-left:auto}
.codes-row:hover .codes-hint{color:rgba(250,204,21,.8)}

.badge{display:inline-flex;align-items:center;border-radius:999px;padding:7px 10px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge-works{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.badge-broken{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.badge-deleted{background:rgba(100,116,139,.12);color:#cbd5e1;border:1px solid rgba(100,116,139,.3)}
.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.lists.single{grid-template-columns:1fr}
.list-box{padding:16px;border-radius:16px;border:1px solid rgba(148,163,184,.12);background:rgba(148,163,184,.03)}
.list-box h4{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.list-box ul{margin:0;padding-left:18px;color:var(--soft)}
.empty{padding:26px;border-radius:18px;text-align:center;color:var(--soft);background:rgba(148,163,184,.03);border:1px dashed rgba(148,163,184,.2)}

/* LOADER */
.loader{position:fixed;inset:0;z-index:9999;background:#05070d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;opacity:1;transition:opacity .5s ease;pointer-events:all;overflow:hidden}
.loader::before{content:"";position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle, rgba(124,58,237,.32), transparent 65%);filter:blur(50px);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;animation:loaderPulse 2.4s ease-in-out infinite}
.loader-stage{position:relative;width:220px;height:220px;display:grid;place-items:center;overflow:visible}
.logo-half{position:absolute;inset:0;opacity:0;will-change:transform,opacity;transform-origin:50% 50%;display:grid;place-items:center}
.logo-half img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 10px 40px rgba(124,58,237,.5))}
.game-logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;will-change:transform,opacity;transform:scale(.35);transform-origin:50% 50%;filter:drop-shadow(0 20px 60px rgba(124,58,237,.6));pointer-events:none}
.loader-text{color:var(--soft);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.55;position:relative;z-index:1}
.loader-hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:.72rem;color:rgba(148,163,184,.5);letter-spacing:.1em;text-transform:uppercase;opacity:0;animation:hintPulse 1.6s ease-in-out infinite;pointer-events:none}
.loader-hint.show{opacity:1}
@keyframes hintPulse{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes loaderPulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}

@media (max-width:720px){
  .nav{flex-wrap:wrap}.lists{grid-template-columns:1fr}
  .toolbar{flex-direction:column;align-items:stretch}
  .suggest-btn{justify-content:center}
  .card-head{gap:12px}.thumb{width:64px;height:64px;border-radius:12px}
  .title-row{flex-direction:column;align-items:flex-start;gap:8px}
  .loader-stage{width:170px;height:170px}
  .codes-hint{display:none}
}
</style>
</head>
<body>

<script>
const translations = {
  uk: { subtitle:"Каталог і статус проєктів",status:"Статус",all:"Усі",works:"Працює",broken:"Не працює",deleted:"Видалений",checked:"Перевірено",pros:"Плюси",cons:"Мінуси",codes:"Коди",empty:"Нічого не знайдено",emptyHint:"Спробуй інший статус.",suggest:"Запропонувати мод / доповнення",loading:"Завантаження…",copied:"Скопійовано!",clickToCopy:"клікни щоб скопіювати",tapForSound:"торкнись для звуку 🔊" },
  ru: { subtitle:"Каталог и статус проектов",status:"Статус",all:"Все",works:"Работает",broken:"Не работает",deleted:"Удалён",checked:"Проверено",pros:"Плюсы",cons:"Минусы",codes:"Коды",empty:"Ничего не найдено",emptyHint:"Попробуй другой статус.",suggest:"Предложить мод / дополнение",loading:"Загрузка…",copied:"Скопировано!",clickToCopy:"клик чтобы скопировать",tapForSound:"коснись для звука 🔊" },
  en: { subtitle:"Catalog & status tracker",status:"Status",all:"All",works:"Works",broken:"Broken",deleted:"Deleted",checked:"Checked",pros:"Pros",cons:"Cons",codes:"Codes",empty:"No entries found",emptyHint:"Try another status.",suggest:"Suggest a mod / addition",loading:"Loading…",copied:"Copied!",clickToCopy:"click to copy",tapForSound:"tap for sound 🔊" }
};

const statusOrder = ["all","works","broken","deleted"];

const INLINE_MODS = [
  { id:"a-rivals", title:"a", status:"broken",
    placeUrl:"https://www.roblox.com/games/96885652495783/a",
    creator:"trev", creatorUrl:"https://www.roblox.com/users/1422380479/profile",
    creatorAvatar:"https://tr.rbxcdn.com/30DAY-AvatarHeadshot-824E206DFE3A66D06256374B6A4449F6-Png/150/150/AvatarHeadshot/Webp/noFilter",
    group:"Yea ofc", groupUrl:"https://www.roblox.com/communities/529875523/Yea-ofc",
    groupAvatar:"https://tr.rbxcdn.com/180DAY-c505e9ee815eca2d7872018c5dace142/150/150/Image/Webp/noFilter",
    discordUrl:"https://discord.gg/ejeXS2JfVE",
    discordIcon:"https://images-eds-ssl.xboxlive.com/image?url=4rt9.lXDC4H_93laV1_eHM0OYfiFeMI2p9MWie0CvL99U4GA1gf6_kayTt_kBblFwHwo8BW8JXlqfnYxKPmmBevsdZpJiIhrXJKvOSYipsYbqdUBBn6r6Hb.keWYwuyu5QJ84NCtr5ij3JMrlPglnBeeDch3kJBTCQneZnfl9dA-&format=source",
    checked:"25.10.2026", tags:["rauls","banana"],
    codes:{uk:"FREEBUX — 2к монет",ru:"FREEBUX — 2к монет",en:"FREEBUX — 2k coins"},
    image:"https://tr.rbxcdn.com/180DAY-b224f9ad0b8cba80f07b07fcf7afdfcd/150/150/Image/Webp/noFilter",
    pros:{uk:[],ru:[],en:[]},
    cons:{uk:["Гра стала недоступною (не видалена)"],ru:["Игра стала недоступной (не удалена)"],en:["Game became inaccessible (not deleted)"]}
  },
  { id:"josh-rivals-modded", title:"Josh's RIVALS MODDED", status:"works",
    placeUrl:"https://www.roblox.com/games/94069113295113/Joshs-RIVALS-MODDED",
    creator:"Ixspan7039", creatorUrl:"https://www.roblox.com/users/10797552845/profile",
    checked:"24.10.2026", tags:["modded shop"],
    image:"https://tr.rbxcdn.com/180DAY-26de3a6f3be928df6691f27dc32575c9/256/256/GameIcon4/Webp/noFilter",
    creatorAvatar:"https://tr.rbxcdn.com/30DAY-AvatarHeadshot-A634EA479C0501425C858A8C082E9D09-Png/150/150/AvatarHeadshot/Webp/noFilter",
    pros:{uk:[],ru:[],en:[]},
    cons:{
      uk:["Платна адмін-панель","Сміттєві адмін-гармати та скіни за робукси","Немає ранкед-шопу та інспектів","Закрито багато контенту: скіни ранкед-шопу, кей-скіни (окрім тих, що є в шопі), арч-скіни, кристал-скіни, секретні предмети, інше"],
      ru:["Платная админ-панель","Мусорные админ-пушки и скины за робуксы","Нет ранкед-шопа и инспектов","Закрыто много контента: скины ранкед-шопа, кей-скины (кроме тех, что есть в шопе), арч-скины, кристалл-скины, секретные предметы, прочее"],
      en:["Paid admin panel","Junk admin guns and skins for Robux","No ranked shop or inspects","Lots of content locked: ranked shop skins, key skins (except those available in the shop), arch skins, crystal skins, secret items, and more"]
    }
  }
];

const LANG_KEY="rivalsHubLang", LOADER_KEY="rivalsHubLoaded";
const SOUND_INTRO_URL="./assets/2102001_NosniyGames_SuperGolf_IntroSound_v4_6384899588.ogg";
const SOUND_CLICK_URL="./assets/click_sound_177266782.ogg";

const introAudio=new Audio(SOUND_INTRO_URL); introAudio.volume=0.5; introAudio.preload="auto";
let introPlayed=false;
function tryIntro(){ if(introPlayed)return; try{ introAudio.currentTime=0; const p=introAudio.play(); if(p&&p.then){ p.then(()=>{ introPlayed=true; const h=document.getElementById("loaderHint"); if(h)h.classList.remove("show"); }).catch(()=>{}); } }catch(e){} }
tryIntro();
const soundTriggers=["pointerdown","mousemove","scroll","keydown","touchstart","click"];
function onAnyActivity(){ tryIntro(); if(introPlayed) soundTriggers.forEach(ev=>document.removeEventListener(ev,onAnyActivity)); }
soundTriggers.forEach(ev=>document.addEventListener(ev,onAnyActivity,{passive:true}));
setTimeout(()=>{ if(!introPlayed){ const h=document.getElementById("loaderHint"); if(h){ h.textContent=(translations[currentLang]&&translations[currentLang].tapForSound)||"tap for sound 🔊"; h.classList.add("show"); } } },600);
function playClick(){ try{ const a=new Audio(SOUND_CLICK_URL); a.volume=0.25; const p=a.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function t(k){return (translations[currentLang]&&translations[currentLang][k])||k}
function pick(obj){ if(!obj)return []; return obj[currentLang]||obj.uk||[]; }
function pickStr(obj){ if(!obj)return ""; return obj[currentLang]||obj.uk||""; }
function saveLang(lang){ try{ localStorage.setItem(LANG_KEY,lang); }catch(e){} }
function loadSavedLang(){ try{ const s=localStorage.getItem(LANG_KEY); if(s&&translations[s])return s; }catch(e){} return "uk"; }

let currentLang=loadSavedLang();
let mods=[];

const brandSubtitle=document.getElementById("brandSubtitle");
const statusLabel=document.getElementById("statusLabel");
const statusFilter=document.getElementById("statusFilter");
const modList=document.getElementById("modList");
const suggestLabel=document.getElementById("suggestLabel");
const loaderText=document.getElementById("loaderText");
const langButtons=document.querySelectorAll(".lang-btn");

function rebuildStatusFilter(){ const p=statusFilter.value||"all"; statusFilter.innerHTML=statusOrder.map(v=>'<option value="'+v+'">'+esc(t(v))+'</option>').join(""); statusFilter.value=p; }
function extractCode(str){ if(!str)return ""; const parts=String(str).split(/\s+[—–]\s+|\s+-\s+/); return (parts[0]||"").trim(); }

function renderMods(){
  const selected=statusFilter.value||"all";
  const visible=mods.filter(m=>selected==="all"||m.status===selected);
  if(visible.length===0){ modList.innerHTML='<div class="empty"><h3>'+esc(t("empty"))+'</h3><p>'+esc(t("emptyHint"))+'</p></div>'; return; }

  modList.innerHTML=visible.map(m=>{
    const prosArr=Array.isArray(pick(m.pros))?pick(m.pros):[];
    const consArr=Array.isArray(pick(m.cons))?pick(m.cons):[];
    const codesVal=pickStr(m.codes);
    const codeCopy=extractCode(codesVal);
    const tagsArr=Array.isArray(m.tags)?m.tags:[];
    const pros=prosArr.map(p=>'<li>'+esc(p)+'</li>').join("");
    const cons=consArr.map(c=>'<li>'+esc(c)+'</li>').join("");
    const tagsHtml=tagsArr.length?'<div class="tags-row">'+tagsArr.map(tg=>'<span class="tag">'+esc(tg)+'</span>').join("")+'</div>':'';
    const codesHtml=codesVal?'<div class="codes-row" role="button" tabindex="0" data-copy="'+esc(codeCopy)+'"><span class="codes-label">'+esc(t("codes"))+':</span><span class="codes-value">'+esc(codesVal)+'</span><span class="codes-hint">'+esc(t("clickToCopy"))+'</span></div>':'';
    const thumbHtml=m.image?'<img class="thumb" src="'+esc(m.image)+'" alt="'+esc(m.title)+'" loading="lazy" />':'';
    const avatarHtml=m.creatorAvatar?'<img class="avatar" src="'+esc(m.creatorAvatar)+'" alt="" loading="lazy" />':'';
    const groupHtml=(m.group&&m.groupUrl)?'<span class="dot">•</span><a class="group" href="'+esc(m.groupUrl)+'" target="_blank" rel="noopener noreferrer">'+(m.groupAvatar?'<img class="avatar group" src="'+esc(m.groupAvatar)+'" alt="" loading="lazy" />':'')+esc(m.group)+'</a>':'';
    const discordHtml=m.discordUrl?'<a class="discord-link" href="'+esc(m.discordUrl)+'" target="_blank" rel="noopener noreferrer" title="Discord">'+(m.discordIcon?'<img class="discord-icon" src="'+esc(m.discordIcon)+'" alt="Discord" loading="lazy" />':'Discord')+'</a>':'';
    const prosBox=prosArr.length?'<div class="list-box"><h4>'+esc(t("pros"))+'</h4><ul>'+pros+'</ul></div>':'';
    const consBox=consArr.length?'<div class="list-box"><h4>'+esc(t("cons"))+'</h4><ul>'+cons+'</ul></div>':'';
    const listsHtml=(prosArr.length||consArr.length)?'<div class="'+((prosArr.length&&consArr.length)?'lists':'lists single')+'">'+prosBox+consBox+'</div>':'';

    return '<article class="card">'
      +'<div class="card-head">'+thumbHtml
      +'<div class="head-body">'
      +'<div class="title-row"><h3 class="card-title"><a href="'+esc(m.placeUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(m.title)+'</a></h3><span class="badge badge-'+esc(m.status)+'">'+esc(t(m.status))+'</span></div>'
      +'<div class="card-meta">'+avatarHtml+'<a class="creator" href="'+esc(m.creatorUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(m.creator)+'</a>'+groupHtml+'<span class="dot">•</span><span>'+esc(t("checked"))+': '+esc(m.checked)+'</span>'+(discordHtml?'<span class="dot">•</span>'+discordHtml:'')+'</div>'
      +tagsHtml
      +'</div></div>'
      +codesHtml
      +listsHtml
      +'</article>';
  }).join("");
}

function applyLang(){
  brandSubtitle.textContent=t("subtitle");
  statusLabel.textContent=t("status");
  suggestLabel.textContent=t("suggest");
  if(loaderText) loaderText.textContent=t("loading");
  const h=document.getElementById("loaderHint");
  if(h&&!introPlayed) h.textContent=t("tapForSound");
  document.documentElement.lang=currentLang;
  rebuildStatusFilter();
  langButtons.forEach(b=>b.classList.toggle("active",b.dataset.lang===currentLang));
  renderMods();
}

langButtons.forEach(btn=>btn.addEventListener("click",()=>{ currentLang=btn.dataset.lang; saveLang(currentLang); applyLang(); }));
statusFilter.addEventListener("change",renderMods);

async function copyText(text){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand("copy"); document.body.removeChild(ta); return ok; }catch(e){ return false; }
}
function showCopied(row){ row.classList.add("copied"); const val=row.querySelector(".codes-value"); const original=val.textContent; val.textContent=t("copied"); setTimeout(()=>{ row.classList.remove("copied"); val.textContent=original; },1200); }

document.addEventListener("click",async(e)=>{
  const row=e.target.closest(".codes-row");
  if(row){ e.preventDefault(); const text=row.dataset.copy; if(text){ const ok=await copyText(text); if(ok)showCopied(row); } playClick(); return; }
  if(e.target.closest("a, button")) playClick();
});
document.addEventListener("keydown",async(e)=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const row=e.target.closest(".codes-row");
  if(row){ e.preventDefault(); const text=row.dataset.copy; if(text){ const ok=await copyText(text); if(ok)showCopied(row); } playClick(); }
});

async function loadMods(){
  try{ const res=await fetch("./mods.json?v="+Date.now()); if(res.ok){ mods=await res.json(); return; } }catch(e){}
  mods=INLINE_MODS.slice();
}

(function runLoader(){
  const loader=document.getElementById("loader"); if(!loader)return;
  let shown=false; try{ shown=sessionStorage.getItem(LOADER_KEY)==="1"; }catch(e){}
  if(shown){ loader.remove(); return; }
  const N=document.getElementById("logoN"), G=document.getElementById("logoG"), gameLogo=document.getElementById("gameLogo");
  const N_START_X=-170,G_START_X=170,N_MID_X=-22,G_MID_X=22,N_END_X=-180,G_END_X=180;
  const T_PAUSE=150,T_SPIRAL_DUR=1200,T_HOLD=200,T_SPLIT_DUR=550,T_LOGO_IN=450,T_LOGO_HOLD=450,T_FADE=500;
  const T_SPIRAL_START=T_PAUSE, T_SPIRAL_END=T_SPIRAL_START+T_SPIRAL_DUR, T_HOLD_END=T_SPIRAL_END+T_HOLD, T_SPLIT_END=T_HOLD_END+T_SPLIT_DUR, T_LOGO_START=T_SPLIT_END-100, T_LOGO_END=T_LOGO_START+T_LOGO_IN, T_FADE_START=T_LOGO_END+T_LOGO_HOLD, T_END=T_FADE_START+T_FADE;
  const start=performance.now(); let done=false;
  const easeOutQuint=x=>1-Math.pow(1-x,5), easeInOutSine=x=>-(Math.cos(Math.PI*x)-1)/2, easeOutCubic=x=>1-Math.pow(1-x,3), lerp=(a,b,k)=>a+(b-a)*k;
  function frame(now){
    if(done)return; const e=now-start;
    if(e<T_SPIRAL_START){ N.style.opacity=0; G.style.opacity=0; }
    else if(e<T_SPIRAL_END){
      const t01=(e-T_SPIRAL_START)/T_SPIRAL_DUR, easePos=easeOutQuint(t01);
      const nx=lerp(N_START_X,N_MID_X,easePos), gx=lerp(G_START_X,G_MID_X,easePos);
      const p=t01*100, rad=Math.sqrt(Math.max(0,1-Math.pow(p/100-1,2))), v41=(rad*540+180)%360, rot=-v41;
      N.style.transform='translateX('+nx+'%) rotate('+rot+'deg)'; G.style.transform='translateX('+gx+'%) rotate('+rot+'deg)';
      N.style.opacity=Math.min(1,t01*2.5); G.style.opacity=Math.min(1,t01*2.5);
    }
    else if(e<T_HOLD_END){ N.style.transform='translateX('+N_MID_X+'%) rotate(0deg)'; G.style.transform='translateX('+G_MID_X+'%) rotate(0deg)'; N.style.opacity=1; G.style.opacity=1; }
    else if(e<T_SPLIT_END){
      const t01=(e-T_HOLD_END)/T_SPLIT_DUR, easePos=easeInOutSine(t01);
      const nx=lerp(N_MID_X,N_END_X,easePos), gx=lerp(G_MID_X,G_END_X,easePos);
      const v10=(720*t01*t01)%360;
      N.style.transform='translateX('+nx+'%) rotate('+(-v10)+'deg)'; G.style.transform='translateX('+gx+'%) rotate('+v10+'deg)';
      N.style.opacity=1-easePos*0.7; G.style.opacity=1-easePos*0.7;
    }
    else { N.style.opacity=0; G.style.opacity=0; }
    if(e<T_LOGO_START){ gameLogo.style.opacity=0; gameLogo.style.transform='scale(.35)'; }
    else if(e<T_LOGO_END){ const t01=(e-T_LOGO_START)/T_LOGO_IN, ease=easeOutCubic(t01); gameLogo.style.opacity=ease; gameLogo.style.transform='scale('+lerp(0.35,1,ease)+')'; }
    else { gameLogo.style.opacity=1; gameLogo.style.transform='scale(1)'; }
    if(e>=T_FADE_START){ const t01=Math.min(1,(e-T_FADE_START)/T_FADE); loader.style.opacity=1-t01; }
    if(e<T_END) requestAnimationFrame(frame);
    else { done=true; try{ sessionStorage.setItem(LOADER_KEY,"1"); }catch(err){} loader.remove(); }
  }
  requestAnimationFrame(frame);
})();

loadMods().then(applyLang);
</script>
