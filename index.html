<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Rivals Hub</title>
<style>
@font-face{font-family:'Rubik';src:url('./assets/Rubik-Regular_12187288714.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-Medium_12187271237.ttf') format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-SemiBold_12187320363.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-Bold_12187303601.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-ExtraBold_12187262242.ttf') format('truetype');font-weight:800;font-display:swap}
@font-face{font-family:'Rubik';src:url('./assets/Rubik-Black_12187280273.ttf') format('truetype');font-weight:900;font-display:swap}
:root{--bg:#070b14;--panel:rgba(15,23,42,.8);--line:rgba(148,163,184,.18);--text:#e2e8f0;--soft:#a5b4cf;--violet:#7c3aed;--violet-2:#c084fc;--shadow:0 20px 45px rgba(15,23,42,.42)}
*{box-sizing:border-box}
body{margin:0;font-family:'Rubik',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;position:relative;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,select{font:inherit}
.glow{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.25;pointer-events:none;z-index:0}
.glow-a{background:rgba(124,58,237,.55);top:80px;left:-120px}
.glow-b{background:rgba(34,197,94,.28);right:-60px;bottom:80px}
.container{width:min(1100px,calc(100% - 32px));margin:0 auto;position:relative;z-index:1}
.topbar{position:sticky;top:0;z-index:10;backdrop-filter:blur(18px);background:rgba(7,11,20,.7);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0}
.brand{display:flex;align-items:center;gap:14px}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--violet-2));box-shadow:var(--shadow);overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:contain;padding:6px}
.brand-title{font-weight:800;letter-spacing:-.03em}
.brand-subtitle{color:var(--soft);font-size:.78rem}
.lang-switcher{display:flex;align-items:center;gap:6px;margin-left:auto}
.lang-btn{border:1px solid rgba(148,163,184,.2);background:rgba(15,23,42,.7);color:var(--soft);border-radius:8px;padding:6px 10px;font-size:.72rem;font-weight:700;cursor:pointer;transition:all .15s ease}
.lang-btn:hover{color:var(--text);border-color:rgba(196,181,253,.35)}
.lang-btn.active{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border-color:transparent}

.toolbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 14px}
.filter-tabs{display:flex;gap:8px;flex-wrap:wrap}
.filter-tab{background:transparent;border:1px solid var(--line);color:var(--soft);padding:8px 16px;border-radius:10px;font-size:.85rem;font-weight:600;cursor:pointer;transition:all .15s ease}
.filter-tab:hover{color:var(--text);border-color:rgba(196,181,253,.4)}
.filter-tab.active{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border-color:transparent}

.suggest-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(196,181,253,.35);background:rgba(124,58,237,.1);color:#d8b4fe;border-radius:12px;padding:11px 16px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .15s ease}
.suggest-btn:hover{background:rgba(124,58,237,.18);border-color:rgba(196,181,253,.55);color:#f3e8ff}
.mod-list{display:grid;gap:22px;padding-bottom:40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.card-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:18px}
.thumb{width:88px;height:88px;border-radius:16px;object-fit:cover;flex-shrink:0;background:rgba(148,163,184,.08);border:1px solid var(--line)}
.head-body{flex:1;min-width:0}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
.card-title{margin:0;font-size:clamp(1.2rem,2vw,1.6rem)}
.card-title a:hover{color:#c4b5fd}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--soft);font-size:.82rem;margin-bottom:10px}
.avatar{width:22px;height:22px;border-radius:50%;object-fit:cover;background:rgba(148,163,184,.1);border:1px solid var(--line)}
.avatar.group{width:18px;height:18px;border-radius:6px}
.creator,.group{color:#d8b4fe;display:inline-flex;align-items:center;gap:6px}
.creator:hover,.group:hover{text-decoration:underline}
.discord-link{display:inline-flex;align-items:center;justify-content:center;color:#d8b4fe;transition:transform .12s ease}
.discord-link:hover{transform:scale(1.1)}
.dot{color:var(--soft);opacity:.6}
.tags-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{display:inline-block;padding:5px 10px;border-radius:999px;background:rgba(148,163,184,.08);border:1px solid rgba(148,163,184,.14);color:var(--soft);font-size:.72rem}

/* Стили для приватки */
.private-badge{display:inline-flex;align-items:center;padding:5px 10px;border-radius:999px;font-size:.72rem;font-weight:700;margin-bottom:10px;margin-right:8px;}
.private-badge.free{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3);}
.private-badge.paid{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3);}

.codes-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.code-pill{display:inline-flex;align-items:center;padding:8px 14px;border-radius:10px;background:rgba(250,204,21,.06);border:1px solid rgba(250,204,21,.22);font-size:.82rem;color:#fde68a;cursor:pointer;user-select:none;transition:all .15s ease}
.code-pill:hover{background:rgba(250,204,21,.12);border-color:rgba(250,204,21,.4)}
.code-pill:active{transform:scale(.98)}
.code-pill.copied{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.4)}
.code-pill.copied .codes-value{color:#86efac}
.code-pill .codes-value{color:#fef3c7;font-family:'Rubik',monospace;letter-spacing:.02em;transition:color .15s ease}

.badge{display:inline-flex;align-items:center;border-radius:999px;padding:7px 10px;font-size:.72rem;font-weight:700;white-space:nowrap}
.badge-works{background:rgba(34,197,94,.12);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.badge-broken{background:rgba(239,68,68,.12);color:#fca5a5;border:1px solid rgba(239,68,68,.3)}
.badge-deleted{background:rgba(100,116,139,.12);color:#cbd5e1;border:1px solid rgba(100,116,139,.3)}
.lists{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.lists.single{grid-template-columns:1fr}
.list-box{padding:16px;border-radius:16px;border:1px solid rgba(148,163,184,.12);background:rgba(148,163,184,.03)}
.list-box h4{margin:0 0 12px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--soft)}
.list-box ul{margin:0;padding-left:18px;color:var(--soft)}
.empty{padding:26px;border-radius:18px;text-align:center;color:var(--soft);background:rgba(148,163,184,.03);border:1px dashed rgba(148,163,184,.2)}

.loader{position:fixed;inset:0;z-index:9999;background:#05070d;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;opacity:1;transition:opacity .5s ease;pointer-events:all;overflow:hidden}
.loader::before{content:"";position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle, rgba(124,58,237,.32), transparent 65%);filter:blur(50px);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;animation:loaderPulse 2.4s ease-in-out infinite}
.loader-stage{position:relative;width:220px;height:220px;display:grid;place-items:center;overflow:visible}
.logo-half{position:absolute;inset:0;opacity:0;will-change:transform,opacity;transform-origin:50% 50%;display:grid;place-items:center}
.logo-half img{width:100%;height:100%;object-fit:contain;pointer-events:none;filter:drop-shadow(0 10px 40px rgba(124,58,237,.5))}
.game-logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;will-change:transform,opacity;transform:scale(.35);transform-origin:50% 50%;filter:drop-shadow(0 20px 60px rgba(124,58,237,.6));pointer-events:none}
.loader-text{color:var(--soft);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.55;position:relative;z-index:1}
.loader-hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);font-size:.72rem;color:rgba(148,163,184,.5);letter-spacing:.1em;text-transform:uppercase;opacity:0;animation:hintPulse 1.6s ease-in-out infinite;pointer-events:none}
.loader-hint.show{opacity:1}
@keyframes hintPulse{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes loaderPulse{0%,100%{opacity:.7;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}

.device-toast {position: fixed;bottom: -150px;left: 50%;transform: translateX(-50%);width: calc(100% - 32px);max-width: 420px;background: rgba(15, 23, 42, 0.95);backdrop-filter: blur(16px);border: 1px solid rgba(148, 163, 184, 0.2);border-radius: 16px;padding: 14px 16px;display: flex;align-items: center;gap: 14px;z-index: 10000;box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);transition: bottom 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1), opacity 0.3s ease;opacity: 0;pointer-events: none;}
.device-toast::before {content: "";position: absolute;bottom: 0; left: 0; right: 0;height: 3px;background: linear-gradient(90deg, var(--violet), var(--violet-2));border-radius: 0 0 16px 16px;}
.device-toast.show {bottom: 24px;opacity: 1;pointer-events: auto;}
.device-toast-icon {width: 46px;height: 46px;flex-shrink: 0;background: rgba(124, 58, 237, 0.15);border: 1px solid rgba(196,181,253,.3);border-radius: 50%;display: grid;place-items: center;color: var(--violet-2);}
.device-toast-icon svg {width: 26px;height: 26px;fill: currentColor;}
.device-toast-content {flex: 1;min-width: 0;}
.device-toast-title {font-weight: 700;font-size: 0.95rem;color: var(--text);margin-bottom: 2px;white-space: nowrap;overflow: hidden;text-overflow: ellipsis;}
.device-toast-sub {font-size: 0.8rem;color: var(--soft);white-space: nowrap;overflow: hidden;text-overflow: ellipsis;}
.device-toast-close {font-size: 1.5rem;color: #64748b;cursor: pointer;line-height: 1;padding: 4px;margin-top: -8px;transition: color 0.15s ease;}
.device-toast-close:hover {color: var(--text);}

@media (max-width:720px){.nav{flex-wrap:wrap}.lists{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.suggest-btn{justify-content:center}.card-head{gap:12px}.thumb{width:64px;height:64px;border-radius:12px}.title-row{flex-direction:column;align-items:flex-start;gap:8px}.loader-stage{width:170px;height:170px}}
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-stage">
    <div class="logo-half" id="logoN"><img src="./assets/Arseniy_Borisenko.png" alt="" /></div>
    <div class="logo-half" id="logoG"><img src="./assets/Arseniy_Borisenko.png" alt="" /></div>
    <img class="game-logo" id="gameLogo" src="./assets/Untitled6.png" alt="Rivals" />
  </div>
  <div class="loader-text" id="loaderText">Loading…</div>
  <div class="loader-hint" id="loaderHint">tap for sound 🔊</div>
</div>

<div class="glow glow-a"></div>
<div class="glow glow-b"></div>

<header class="topbar">
  <div class="container nav">
    <div class="brand">
      <div class="brand-mark"><img src="./assets/Untitled6.png" alt="R" /></div>
      <div>
        <div class="brand-title">Rivals Hub</div>
        <div class="brand-subtitle" id="brandSubtitle">Каталог і статус проєктів</div>
      </div>
    </div>
    <div class="lang-switcher">
      <button class="lang-btn active" data-lang="uk" type="button">UA</button>
      <button class="lang-btn" data-lang="ru" type="button">RU</button>
      <button class="lang-btn" data-lang="en" type="button">EN</button>
    </div>
  </div>
</header>

<main class="container">
  <section class="toolbar">
    <div class="filter-tabs" id="filterTabs"></div>
    <a class="suggest-btn" id="suggestBtn" href="mailto:arsebor100@gmail.com?subject=Rivals%20Hub%20suggestion&body=Roblox%20link%3A%0Ahttps%3A%2F%2Fwww.roblox.com%2Fgames%2F17625359962%2FRIVALS%20(example)" target="_blank" rel="noopener noreferrer">
      <span id="suggestLabel">Запропонувати мод / доповнення</span>
    </a>
  </section>
  <section id="modList" class="mod-list"></section>
</main>

<div id="deviceToast" class="device-toast">
  <div class="device-toast-icon" id="deviceIcon"></div>
  <div class="device-toast-content">
    <div class="device-toast-title" id="deviceTitle"></div>
    <div class="device-toast-sub" id="deviceSub"></div>
  </div>
  <div class="device-toast-close" id="deviceClose">×</div>
</div>

<script>
const translations = {
  uk: { subtitle:"Каталог і статус проєктів",status:"Статус",all:"Усі",works:"Працює",broken:"Не працює",deleted:"Видалений",checked:"Перевірено",pros:"Плюси",cons:"Мінуси",codes:"Коди",empty:"Нічого не знайдено",emptyHint:"Спробуй інший статус.",suggest:"Запропонувати мод / доповнення",loading:"Завантаження…",copied:"Скопійовано!",tapForSound:"торкнись для звуку 🔊", pcLaptop:"ПК / Ноутбук", device:"Пристрій", unknownOS:"Невідома ОС", browser:"Браузер", privFree:"Безкоштовна приватка", privPaid:"Платна приватка" },
  ru: { subtitle:"Каталог и статус проектов",status:"Статус",all:"Все",works:"Работает",broken:"Не работает",deleted:"Удалён",checked:"Проверено",pros:"Плюсы",cons:"Минусы",codes:"Коды",empty:"Ничего не найдено",emptyHint:"Попробуй другой статус.",suggest:"Предложить мод / дополнение",loading:"Загрузка…",copied:"Скопировано!",tapForSound:"коснись для звука 🔊", pcLaptop:"ПК / Ноутбук", device:"Устройство", unknownOS:"Неизвестная ОС", browser:"Браузер", privFree:"Бесплатная приватка", privPaid:"Платная приватка" },
  en: { subtitle:"Catalog & status tracker",status:"Status",all:"All",works:"Works",broken:"Broken",deleted:"Deleted",checked:"Checked",pros:"Pros",cons:"Cons",codes:"Codes",empty:"No entries found",emptyHint:"Try another status.",suggest:"Suggest a mod / addition",loading:"Loading…",copied:"Copied!",tapForSound:"tap for sound 🔊", pcLaptop:"PC / Laptop", device:"Device", unknownOS:"Unknown OS", browser:"Browser", privFree:"Free private server", privPaid:"Paid private server" }
};

const LANG_KEY="rivalsHubLang", LOADER_KEY="rivalsHubLoaded";
const SOUND_INTRO_URL="./assets/2102001_NosniyGames_SuperGolf_IntroSound_v4_6384899588.ogg";
const SOUND_CLICK_URL="./assets/click_sound_177266782.ogg";

const introAudio=new Audio(SOUND_INTRO_URL); introAudio.volume=0.5; introAudio.preload="auto";
let introPlayed=false;
function tryIntro(){ if(introPlayed)return; try{ introAudio.currentTime=0; const p=introAudio.play(); if(p&&p.then){ p.then(()=>{ introPlayed=true; const h=document.getElementById("loaderHint"); if(h)h.classList.remove("show"); }).catch(()=>{}); } }catch(e){} }
tryIntro();
const soundTriggers=["pointerdown","mousemove","scroll","keydown","touchstart","click"];
function onAnyActivity(){ tryIntro(); if(introPlayed) soundTriggers.forEach(ev=>document.removeEventListener(ev,onAnyActivity)); }
soundTriggers.forEach(ev=>document.addEventListener(ev,onAnyActivity,{passive:true}));
setTimeout(()=>{ if(!introPlayed){ const h=document.getElementById("loaderHint"); if(h){ h.textContent=(translations[currentLang]&&translations[currentLang].tapForSound)||"tap for sound 🔊"; h.classList.add("show"); } } },600);
function playClick(){ try{ const a=new Audio(SOUND_CLICK_URL); a.volume=0.25; const p=a.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} }

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function t(k){return (translations[currentLang]&&translations[currentLang][k])||k}
function pick(obj){ if(!obj)return []; return obj[currentLang]||obj.uk||[]; }
function pickStr(obj){ if(!obj)return ""; return obj[currentLang]||obj.uk||""; }
function saveLang(lang){ try{ localStorage.setItem(LANG_KEY,lang); }catch(e){} }

function loadSavedLang(){
  try{ 
    const s=localStorage.getItem(LANG_KEY); 
    if(s&&translations[s])return s; 
  }catch(e){}
  const sysLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
  if (sysLang.startsWith('uk')) return 'uk';
  if (sysLang.startsWith('ru')) return 'ru';
  return 'en';
}

let currentLang=loadSavedLang();
let mods=[];
let currentFilter="works";

let deviceData = {
  model: '',
  os: '',
  icon: 'linux',
  browser: ''
};

const brandSubtitle=document.getElementById("brandSubtitle");
const modList=document.getElementById("modList");
const suggestLabel=document.getElementById("suggestLabel");
const loaderText=document.getElementById("loaderText");
const langButtons=document.querySelectorAll(".lang-btn");
const filterTabs=document.getElementById("filterTabs");

function updateTabs() {
  const statuses = ["works", "broken", "deleted", "all"];
  filterTabs.innerHTML = statuses.map(st => {
    let count = (st === "all") ? mods.length : mods.filter(m => m.status === st).length;
    const label = t(st) + ' (' + count + ')';
    const active = (st === currentFilter) ? ' active' : '';
    return '<button class="filter-tab' + active + '" data-status="' + st + '">' + esc(label) + '</button>';
  }).join("");
}

function renderMods(){
  const visible=mods.filter(m=>currentFilter==="all"||m.status===currentFilter);
  if(visible.length===0){ modList.innerHTML='<div class="empty"><h3>'+esc(t("empty"))+'</h3><p>'+esc(t("emptyHint"))+'</p></div>'; return; }

  modList.innerHTML=visible.map(m=>{
    const isHiddenInfo = (m.status === "broken" || m.status === "deleted");
    let prosArr = [], consArr = [];
    if (!isHiddenInfo) {
      prosArr=Array.isArray(pick(m.pros))?pick(m.pros):[];
      consArr=Array.isArray(pick(m.cons))?pick(m.cons):[];
    }
    const codesVal=pickStr(m.codes);
    const tagsArr=Array.isArray(m.tags)?m.tags:[];
    const pros=prosArr.map(p=>'<li>'+esc(p)+'</li>').join("");
    const cons=consArr.map(c=>'<li>'+esc(c)+'</li>').join("");
    const tagsHtml=tagsArr.length?'<div class="tags-row">'+tagsArr.map(tg=>'<span class="tag">'+esc(tg)+'</span>').join("")+'</div>':'';
    
    let codesHtml = '';
    if (!isHiddenInfo && codesVal) {
      const codeList = codesVal.split(',').map(c => c.trim()).filter(Boolean);
      if (codeList.length > 0) {
        codesHtml = '<div class="codes-row">';
        codeList.forEach(c => {
          codesHtml += '<span class="code-pill" role="button" tabindex="0" data-copy="'+esc(c)+'"><span class="codes-value">'+esc(c)+'</span></span>';
        });
        codesHtml += '</div>';
      }
    }

    // Бейдж приватки
    let privateHtml = '';
    if (!isHiddenInfo && m.private && m.private !== "none") {
      if (m.private === "free") {
        privateHtml = '<span class="private-badge free">🔓 '+esc(t("privFree"))+'</span>';
      } else if (m.private === "paid") {
        privateHtml = '<span class="private-badge paid">🔒 '+esc(t("privPaid"))+'</span>';
      }
    }

    const thumbHtml = m.image 
      ? '<img class="thumb" src="'+esc(m.image)+'" alt="'+esc(m.title)+'" loading="lazy" />' 
      : '<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:var(--soft);opacity:.5;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="4"/><path d="M6 12h4m-2-2v4m8-2h.01M18 10h.01"/></svg></div>';
    
    const avatarHtml = m.creatorAvatar 
      ? '<img class="avatar" src="'+esc(m.creatorAvatar)+'" alt="" loading="lazy" />' 
      : '<div class="avatar" style="display:flex;align-items:center;justify-content:center;color:var(--soft);"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>';
    
    const groupHtml = (m.group && m.groupUrl)
      ? '<span class="dot">•</span><a class="group" href="'+esc(m.groupUrl)+'" target="_blank" rel="noopener noreferrer">'
        + (m.groupAvatar 
            ? '<img class="avatar group" src="'+esc(m.groupAvatar)+'" alt="" loading="lazy" />' 
            : '<div class="avatar group" style="display:flex;align-items:center;justify-content:center;color:var(--soft);"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></div>')
        + esc(m.group)+'</a>'
      : '';
      
    const discordHtml = m.discordUrl

      : '';

    const prosBox=prosArr.length?'<div class="list-box"><h4>'+esc(t("pros"))+'</h4><ul>'+pros+'</ul></div>':'';

    return '<article class="card">'

      +'<div class="card-meta">'+avatarHtml+'<a class="creator" href="'+esc(m.creatorUrl)+'" target="_blank" rel="noopener noreferrer">'+esc(m.creator)+'</a>'+groupHtml+'<span class="dot">•</span><span>'+esc(t("checked"))+': '+esc(m.checked)+'</span>'+(discordHtml?'<span class="dot">•</span>'+discordHtml:'')+'</div>'
      +'<div style="display:flex;flex-wrap:wrap;align-items:center;">'+privateHtml+tagsHtml+'</div>'
      +'</div></div>'
      +codesHtml
      +listsHtml
      +'</article>';
  }).join("");
}

    ios: `<svg viewBox="0 0 24 24"><path d="M16 1c-.4 1.3-1.3 2.3-2.5 3-1.2.7-2.5.9-3.5.9-.1-1.3.3-2.7 1.2-3.8C12.1.1 13.4-.2 14.4 0c.3-.1.9-.1 1.6.1zm.5 5.5c-1.4 0-2.6.8-3.3.8-.8 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.2 1.2-.1 1.6-.8 3-.8 1.4 0 1.8.8 3 .8 1.2-.1 2-1.1 2.8-2.2.9-1.3 1.3-2.6 1.3-2.7-.1-.1-2.5-1-2.5-3.7 0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.7-3.6-1.7z"/></svg>`,
    macos: `<svg viewBox="0 0 24 24"><path d="M18.7 10c0-2.8 2.3-4.1 2.4-4.2-1.3-1.9-3.3-2.2-4-2.2-1.7-.2-3.3 1-4.2 1-1 0-2.3-1-3.8-1-2 0-3.8 1.2-4.8 3-2 3.5-.5 8.7 1.4 11.5 1 1.4 2.1 2.9 3.6 2.9 1.5-.1 2-.9 3.8-.9 1.8 0 2.3.9 3.8.9 1.5 0 2.5-1.4 3.5-2.8 1.1-1.6 1.5-3.2 1.5-3.3-.1-.1-3.1-1.2-3.1-4.9zM15.2 1.8c.8-1 1.3-2.3 1.2-3.7-1.2.1-2.6.8-3.4 1.8-.7.8-1.3 2.1-1.1 3.4 1.3.1 2.5-.6 3.3-1.5z"/></svg>`,
    linux: `<svg viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v2.5c0 1.5-.5 2.5-1.5 3.5S4 15 4 17a5 5 0 0 0 5 5h6a5 5 0 0 0 5-5c0-2-1-3.5-2-4.5s-1.5-2-1.5-3.5V7a5 5 0 0 0-5-5zm-2 6a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm4 0a1 1 0 1 1 0-2 1 1 0 0 1 0 2zm-2 6c-1.5 0-2.5-1-2.5-1s1-.5 2.5-.5 2.5.5 2.5.5-1 1-2.5 1z"/></svg>`
  };

  let displayModel = deviceData.model;
  if (!displayModel || displayModel.toLowerCase() === 'desktop') {
    if (deviceData.os.includes('Windows')) displayModel = t('pcLaptop');
    else if (deviceData.os.includes('Mac')) displayModel = 'Mac';
    else displayModel = t('device');
  }

  let displayOs = deviceData.os;
  if (displayOs === 'Unknown OS') displayOs = t('unknownOS');

  let displayBrowser = deviceData.browser;

  iconBox.innerHTML = ICONS[deviceData.icon] || ICONS.linux;
  title.textContent = displayModel;
  sub.textContent = `${displayOs} • ${displayBrowser}`;
}

function applyLang(){
  brandSubtitle.textContent=t("subtitle");
  suggestLabel.textContent=t("suggest");
  if(loaderText) loaderText.textContent=t("loading");
  const h=document.getElementById("loaderHint");
  if(h&&!introPlayed) h.textContent=t("tapForSound");
  document.documentElement.lang=currentLang;
  
  langButtons.forEach(b=>b.classList.toggle("active",b.dataset.lang===currentLang));
  updateTabs();
  renderMods();
  renderDeviceInfo(); 
}

langButtons.forEach(btn=>btn.addEventListener("click",()=>{ currentLang=btn.dataset.lang; saveLang(currentLang); applyLang(); }));

filterTabs.addEventListener("click", (e) => {
  const btn = e.target.closest(".filter-tab");
  if (!btn) return;
  currentFilter = btn.dataset.status;
  updateTabs();
  renderMods();
});

async function copyText(text){
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ await navigator.clipboard.writeText(text); return true; } }catch(e){}
  try{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.focus(); ta.select(); const ok=document.execCommand("copy"); document.body.removeChild(ta); return ok; }catch(e){ return false; }
}
function showCopied(pill){ pill.classList.add("copied"); const val=pill.querySelector(".codes-value"); const original=val.textContent; val.textContent=t("copied"); setTimeout(()=>{ pill.classList.remove("copied"); val.textContent=original; },1200); }

document.addEventListener("click",async(e)=>{
  const pill=e.target.closest(".code-pill");
  if(pill){ e.preventDefault(); const text=pill.dataset.copy; if(text){ const ok=await copyText(text); if(ok)showCopied(pill); } playClick(); return; }
  if(e.target.closest("a, button")) playClick();
});
document.addEventListener("keydown",async(e)=>{
  if(e.key!=="Enter"&&e.key!==" ")return;
  const pill=e.target.closest(".code-pill");
  if(pill){ e.preventDefault(); const text=pill.dataset.copy; if(text){ const ok=await copyText(text); if(ok)showCopied(pill); } playClick(); }
});

async function loadMods(){
  try{ const res=await fetch("./mods.json?v="+Date.now()); if(res.ok){ mods=await res.json(); return; } }catch(e){}
  mods=[]; 
}

function initDeviceDetector() {
  const toast = document.getElementById('deviceToast');
  const closeBtn = document.getElementById('deviceClose');

  closeBtn.addEventListener('click', () => toast.classList.remove('show'));

  function getOSInfo(platform, ua) {
    const p = (platform || '').toLowerCase();
    const u = (ua || '').toLowerCase();
    if (p.includes('win') || u.includes('windows')) return { name: 'Windows', icon: 'windows' };
    if (p.includes('android') || u.includes('android')) return { name: 'Android', icon: 'android' };
    if (p.includes('ios') || p.includes('iphone') || u.includes('iphone') || u.includes('ipad')) return { name: 'iOS', icon: 'ios' };
    if (p.includes('mac') || u.includes('macintosh') || u.includes('mac os')) return { name: 'macOS', icon: 'macos' };
    if (p.includes('linux') || u.includes('linux')) return { name: 'Linux', icon: 'linux' };
    return { name: 'Unknown OS', icon: 'linux' };
  }

  async function detect() {
    let osName = 'Unknown OS', osIcon = 'linux', browserName = 'Browser', deviceModel = '';

    if (navigator.userAgentData) {
      try {
        const h = await navigator.userAgentData.getHighEntropyValues(['model', 'platform', 'platformVersion', 'brands']);
        deviceModel = h.model || '';
        const info = getOSInfo(h.platform, navigator.userAgent);
        
        let versionStr = '';
        if (info.name !== 'Windows' && h.platformVersion) {
          versionStr = ' ' + h.platformVersion.split('.')[0];
        }
        osName = info.name + versionStr;
        osIcon = info.icon;

        if (h.brands && h.brands.length > 0) {
          const br = h.brands.find(b => !b.brand.includes('Chromium') && !b.brand.includes('Not') && b.brand !== 'Google Chrome');
          if (br) browserName = br.brand;
          else if (navigator.userAgentData.brands.find(b => b.brand === 'Google Chrome')) browserName = 'Chrome';
        }
      } catch(e){}
    }

    if (osName === 'Unknown OS') {
      const info = getOSInfo('', navigator.userAgent);
      osName = info.name;
      osIcon = info.icon;
    }

    if (browserName === 'Browser') {
      const ua = navigator.userAgent;
      if (ua.includes('Firefox/')) browserName = 'Firefox';
      else if (ua.includes('Edg/')) browserName = 'Edge';
      else if (ua.includes('OPR/') || ua.includes('Opera')) browserName = 'Opera';
      else if (ua.includes('Chrome/')) browserName = 'Chrome';
      else if (ua.includes('Safari/') && !ua.includes('Chrome')) browserName = 'Safari';
    }

    deviceData = {
      model: deviceModel,
      os: osName,
      icon: osIcon,
      browser: browserName
    };
    
    renderDeviceInfo();
  }
  
  detect();
  
  return () => {
    toast.classList.add('show');
  };
}

let showDeviceToast = null;

(function runLoader(){
  const loader=document.getElementById("loader"); 
  if(!loader)return;
  
  showDeviceToast = initDeviceDetector();

  let shown=false; try{ shown=sessionStorage.getItem(LOADER_KEY)==="1"; }catch(e){}
  
  if(shown){ 
    loader.remove(); 
    if (showDeviceToast) showDeviceToast(); 
    return; 
  }
  
  const N=document.getElementById("logoN"), G=document.getElementById("logoG"), gameLogo=document.getElementById("gameLogo");
  const N_START_X=-170,G_START_X=170,N_MID_X=-22,G_MID_X=22,N_END_X=-180,G_END_X=180;
  const T_PAUSE=150,T_SPIRAL_DUR=1200,T_HOLD=200,T_SPLIT_DUR=550,T_LOGO_IN=450,T_LOGO_HOLD=450,T_FADE=500;
  const T_SPIRAL_START=T_PAUSE, T_SPIRAL_END=T_SPIRAL_START+T_SPIRAL_DUR, T_HOLD_END=T_SPIRAL_END+T_HOLD, T_SPLIT_END=T_HOLD_END+T_SPLIT_DUR, T_LOGO_START=T_SPLIT_END-100, T_LOGO_END=T_LOGO_START+T_LOGO_IN, T_FADE_START=T_LOGO_END+T_LOGO_HOLD, T_END=T_FADE_START+T_FADE;
  const start=performance.now(); let done=false;
  const easeOutQuint=x=>1-Math.pow(1-x,5), easeInOutSine=x=>-(Math.cos(Math.PI*x)-1)/2, easeOutCubic=x=>1-Math.pow(1-x,3), lerp=(a,b,k)=>a+(b-a)*k;
  
  function frame(now){
    if(done)return; const e=now-start;
    if(e<T_SPIRAL_START){ N.style.opacity=0; G.style.opacity=0; }
    else if(e<T_SPIRAL_END){
      const t01=(e-T_SPIRAL_START)/T_SPIRAL_DUR, easePos=easeOutQuint(t01);
      const nx=lerp(N_START_X,N_MID_X,easePos), gx=lerp(G_START_X,G_MID_X,easePos);
      const p=t01*100, rad=Math.sqrt(Math.max(0,1-Math.pow(p/100-1,2))), v41=(rad*540+180)%360, rot=-v41;
      N.style.transform='translateX('+nx+'%) rotate('+rot+'deg)'; G.style.transform='translateX('+gx+'%) rotate('+rot+'deg)';
      N.style.opacity=Math.min(1,t01*2.5); G.style.opacity=Math.min(1,t01*2.5);
    }
    else if(e<T_HOLD_END){ N.style.transform='translateX('+N_MID_X+'%) rotate(0deg)'; G.style.transform='translateX('+G_MID_X+'%) rotate(0deg)'; N.style.opacity=1; G.style.opacity=1; }
    else if(e<T_SPLIT_END){
      const t01=(e-T_HOLD_END)/T_SPLIT_DUR, easePos=easeInOutSine(t01);
      const nx=lerp(N_MID_X,N_END_X,easePos), gx=lerp(G_MID_X,G_END_X,easePos);
      const v10=(720*t01*t01)%360;
      N.style.transform='translateX('+nx+'%) rotate('+(-v10)+'deg)'; G.style.transform='translateX('+gx+'%) rotate('+v10+'deg)';
      N.style.opacity=1-easePos*0.7; G.style.opacity=1-easePos*0.7;
    }
    else { N.style.opacity=0; G.style.opacity=0; }
    
    if(e<T_LOGO_START){ gameLogo.style.opacity=0; gameLogo.style.transform='scale(.35)'; }
    else if(e<T_LOGO_END){ const t01=(e-T_LOGO_START)/T_LOGO_IN, ease=easeOutCubic(t01); gameLogo.style.opacity=ease; gameLogo.style.transform='scale('+lerp(0.35,1,ease)+')'; }
    else { gameLogo.style.opacity=1; gameLogo.style.transform='scale(1)'; }
    
    if(e>=T_FADE_START){ const t01=Math.min(1,(e-T_FADE_START)/T_FADE); loader.style.opacity=1-t01; }
    
    if(e<T_END) requestAnimationFrame(frame);
    else { 
      done=true; 
      try{ sessionStorage.setItem(LOADER_KEY,"1"); }catch(err){} 
      loader.remove(); 
      if (showDeviceToast) showDeviceToast(); 
    }
  }
  requestAnimationFrame(frame);
})();

loadMods().then(applyLang);
